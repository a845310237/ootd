{% extends "base.html" %}

{% block title %}仪表板 - 穿搭AI{% endblock %}

{% block content %}
<div id="dashboard-app" class="hidden">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">欢迎回来，<span id="user-name"></span>！</h1>
        <p class="text-gray-600 mt-2">这是您的穿搭仪表板</p>
    </div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="bg-white shadow rounded-lg p-6">
        <div class="flex items-center">
            <div class="flex-shrink-0">
                <div class="text-indigo-600 text-3xl">👔</div>
            </div>
            <div class="ml-4">
                <p class="text-sm font-medium text-gray-500">衣物总数</p>
                <p class="text-2xl font-semibold text-gray-900" id="clothingCount">-</p>
            </div>
        </div>
    </div>

    <div class="bg-white shadow rounded-lg p-6">
        <div class="flex items-center">
            <div class="flex-shrink-0">
                <div class="text-indigo-600 text-3xl">👗</div>
            </div>
            <div class="ml-4">
                <p class="text-sm font-medium text-gray-500">穿搭方案</p>
                <p class="text-2xl font-semibold text-gray-900" id="outfitCount">-</p>
            </div>
        </div>
    </div>

    <div class="bg-white shadow rounded-lg p-6">
        <div class="flex items-center">
            <div class="flex-shrink-0">
                <div class="text-indigo-600 text-3xl">✨</div>
            </div>
            <div class="ml-4">
                <p class="text-sm font-medium text-gray-500">AI生成</p>
                <p class="text-2xl font-semibold text-gray-900" id="aiGeneratedCount">-</p>
            </div>
        </div>
    </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white shadow rounded-lg p-6">
        <h2 class="text-lg font-medium text-gray-900 mb-4">快速操作</h2>
        <div class="space-y-3">
            <a href="/dashboard/wardrobe" class="block w-full text-center bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700">
                添加衣物
            </a>
            <a href="/dashboard/outfits?action=generate" class="block w-full text-center bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700">
                AI生成穿搭
            </a>
            <a href="/dashboard/outfits?action=diy" class="block w-full text-center bg-gray-600 text-white py-2 px-4 rounded-md hover:bg-gray-700">
                DIY穿搭
            </a>
        </div>
    </div>

    <div class="bg-white shadow rounded-lg p-6">
        <h2 class="text-lg font-medium text-gray-900 mb-4">最近穿搭</h2>
        <div id="recentOutfits" class="space-y-3">
            <p class="text-gray-500 text-sm">加载中...</p>
        </div>
    </div>
</div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
// Check authentication on page load
document.addEventListener('DOMContentLoaded', function() {
    const token = localStorage.getItem('access_token');
    if (!token) {
        window.location.href = '/auth/login';
        return;
    }

    // Show dashboard
    document.getElementById('dashboard-app').classList.remove('hidden');

    // Load user info and dashboard data
    loadUserInfo();
    loadDashboardData();
});

async function loadUserInfo() {
    const token = localStorage.getItem('access_token');

    try {
        const response = await fetch('/api/v1/users/me', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        if (response.ok) {
            const user = await response.json();
            document.getElementById('user-name').textContent = user.name || user.email;
        } else {
            localStorage.removeItem('access_token');
            window.location.href = '/auth/login';
        }
    } catch (error) {
        console.error('Failed to load user info:', error);
    }
}

async function loadDashboardData() {
    const token = localStorage.getItem('access_token');

    try {
        // Load clothing count
        const clothesRes = await fetch('/api/v1/wardrobe', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        if (clothesRes.ok) {
            const clothes = await clothesRes.json();
            document.getElementById('clothingCount').textContent = clothes.length;
        }

        // Load outfit counts
        const outfitsRes = await fetch('/api/v1/outfits', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        if (outfitsRes.ok) {
            const outfits = await outfitsRes.json();
            document.getElementById('outfitCount').textContent = outfits.length;
            const aiGenerated = outfits.filter(o => o.ai_generated).length;
            document.getElementById('aiGeneratedCount').textContent = aiGenerated;

            // Show recent outfits
            const recentOutfits = outfits.slice(0, 3);
            const recentOutfitsHtml = recentOutfits.map(outfit => `
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-md">
                    <div>
                        <p class="font-medium text-gray-900">${outfit.name}</p>
                        <p class="text-sm text-gray-500">${outfit.style}</p>
                    </div>
                    <a href="/dashboard/outfits" class="text-indigo-600 hover:text-indigo-700 text-sm">查看</a>
                </div>
            `).join('');
            document.getElementById('recentOutfits').innerHTML = recentOutfitsHtml || '<p class="text-gray-500 text-sm">暂无穿搭记录</p>';
        }
    } catch (error) {
        console.error('Failed to load dashboard data:', error);
    }
}

loadDashboardData();
</script>
{% endblock %}
