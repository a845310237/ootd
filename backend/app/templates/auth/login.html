{% extends "base.html" %}

{% import "components/button.html" as button %}

{% block title %}登录 - 穿搭AI{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center">
    <div class="max-w-md w-full">
        <div class="bg-white shadow-lg rounded-lg p-8">
            <h1 class="text-2xl font-bold text-center mb-6">登录穿搭AI</h1>

            {% if error %}
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/api/v1/auth/login" id="loginForm">
                <div class="mb-4">
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">邮箱</label>
                    <input type="email" id="username" name="username" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <button type="submit"
                    class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    登录
                </button>
            </form>

            <p class="text-center text-sm text-gray-600 mt-6">
                还没有账号？ <a href="/auth/register" class="text-indigo-600 hover:text-indigo-700">立即注册</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const formData = new FormData(this);
    const data = new URLSearchParams();
    data.append('username', formData.get('username'));
    data.append('password', formData.get('password'));

    try {
        const response = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: data
        });

        if (response.ok) {
            const result = await response.json();
            localStorage.setItem('access_token', result.access_token);
            window.location.href = '/dashboard';
        } else {
            const error = await response.json();
            alert(error.detail || '登录失败');
        }
    } catch (error) {
        alert('登录失败: ' + error.message);
    }
});
</script>
{% endblock %}
