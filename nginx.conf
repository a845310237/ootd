# OOTD 穿搭AI Nginx Configuration
# Server: ootd.zhoumin.shop:80

server {
    listen 80;
    server_name ootd.zhoumin.shop;

    # 日志文件
    access_log /var/log/nginx/ootd-access.log;
    error_log /var/log/nginx/ootd-error.log;

    # 客户端上传文件大小限制（用于图片上传）
    client_max_body_size 10M;

    # 代理到 Next.js 应用（默认端口 3000）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket 支持（Next.js 开发模式热更新需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 代理头部设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓存设置
        proxy_cache_bypass $http_upgrade;

        # 支持 HTTP/1.1 keep-alive
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # 静态资源缓存（Next.js 构建产物）
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    # 图片缓存（上传的衣物图片）
    location /uploads {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 健康检查端点
    location /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
}

