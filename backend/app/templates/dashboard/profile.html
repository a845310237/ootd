{% extends "base.html" %}

{% block title %}个人资料 - 穿搭AI{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white shadow-lg rounded-lg p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">个人资料</h1>

        <form id="profileForm">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">邮箱</label>
                <input type="email" id="email" value="{{ current_user.email }}" disabled
                    class="w-full px-3 py-2 border border-gray-300 rounded-md bg-gray-50">
            </div>

            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-gray-700 mb-2">昵称</label>
                <input type="text" id="name" name="name" value="{{ current_user.name or '' }}"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="height" class="block text-sm font-medium text-gray-700 mb-2">身高 (cm)</label>
                    <input type="number" id="height" name="height" value="{{ current_user.height or '' }}" min="50" max="300"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="weight" class="block text-sm font-medium text-gray-700 mb-2">体重 (kg)</label>
                    <input type="number" id="weight" name="weight" value="{{ current_user.weight or '' }}" min="20" max="300"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <div class="mb-4">
                <label for="bodyType" class="block text-sm font-medium text-gray-700 mb-2">体型</label>
                <select id="bodyType" name="body_type"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">请选择</option>
                    <option value="苗条" {% if current_user.body_type == '苗条' %}selected{% endif %}>苗条</option>
                    <option value="标准" {% if current_user.body_type == '标准' %}selected{% endif %}>标准</option>
                    <option value="丰满" {% if current_user.body_type == '丰满' %}selected{% endif %}>丰满</option>
                </select>
            </div>

            <div class="mb-6">
                <label for="skinTone" class="block text-sm font-medium text-gray-700 mb-2">肤色</label>
                <select id="skinTone" name="skin_tone"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">请选择</option>
                    <option value="白皙" {% if current_user.skin_tone == '白皙' %}selected{% endif %}>白皙</option>
                    <option value="中性" {% if current_user.skin_tone == '中性' %}selected{% endif %}>中性</option>
                    <option value="健康" {% if current_user.skin_tone == '健康' %}selected{% endif %}>健康</option>
                    <option value="深色" {% if current_user.skin_tone == '深色' %}selected{% endif %}>深色</option>
                </select>
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                保存资料
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('profileForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const data = {
        name: document.getElementById('name').value,
        height: document.getElementById('height').value ? parseInt(document.getElementById('height').value) : null,
        weight: document.getElementById('weight').value ? parseInt(document.getElementById('weight').value) : null,
        body_type: document.getElementById('bodyType').value || null,
        skin_tone: document.getElementById('skinTone').value || null
    };

    const token = localStorage.getItem('access_token');

    try {
        const response = await fetch('/api/v1/users/me', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            alert('资料更新成功！');
            location.reload();
        } else {
            const error = await response.json();
            alert(error.detail || '更新失败');
        }
    } catch (error) {
        alert('更新失败: ' + error.message);
    }
});
</script>
{% endblock %}
