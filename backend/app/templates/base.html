<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}穿搭AI{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50">
    {% if current_user %}
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-indigo-600">穿搭AI</a>
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="/dashboard" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">仪表板</a>
                        <a href="/dashboard/wardrobe" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">衣柜</a>
                        <a href="/dashboard/outfits" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">穿搭</a>
                        <a href="/dashboard/profile" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">资料</a>
                    </div>
                </div>
                <div class="flex items-center">
                    {% if current_user.avatar %}
                    <img src="{{ current_user.avatar }}" alt="Avatar" class="h-8 w-8 rounded-full mr-2">
                    {% endif %}
                    <span class="text-gray-700 mr-4">{{ current_user.name or current_user.email }}</span>
                    <form action="/auth/logout" method="post" class="inline">
                        <button type="submit" class="text-red-600 hover:text-red-700 px-3 py-2 rounded-md text-sm font-medium">登出</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', path='/js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
