{% macro button(text, type='button', variant='primary', extra_classes='') %}
<button type="{{ type }}" class="{% if variant == 'primary' %}bg-indigo-600 hover:bg-indigo-700 text-white{% elif variant == 'secondary' %}bg-gray-200 hover:bg-gray-300 text-gray-800{% elif variant == 'danger' %}bg-red-600 hover:bg-red-700 text-white{% elif variant == 'success' %}bg-green-600 hover:bg-green-700 text-white{% endif %} px-4 py-2 rounded-md font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 {{ extra_classes }}">
    {{ text }}
</button>
{% endmacro %}
