{% macro badge(text, variant='default') %}
<span class="{% if variant == 'primary' %}bg-indigo-100 text-indigo-800{% elif variant == 'success' %}bg-green-100 text-green-800{% elif variant == 'warning' %}bg-yellow-100 text-yellow-800{% elif variant == 'danger' %}bg-red-100 text-red-800{% else %}bg-gray-100 text-gray-800{% endif %} px-2 py-1 rounded-full text-xs font-medium">
    {{ text }}
</span>
{% endmacro %}
